# force-analog：ALC887-VD（HDA Intel PCH）前置耳机口 jack 检测误报 workaround
# jack 永远报 available=no，导致 wireplumber 把 profile 路由到 HDMI、
# 耳机路由被排除、默认 sink 候选落空。脚本内 4 个 hook 绕过可用性检查，
# 强制恢复 ~/.local/state/wireplumber 中存储的用户选择。
# 脚本经 XDG_DATA_HOME (~/.local/share/wireplumber/scripts/) 搜索路径解析
wireplumber.components = [
  { name = force-analog.lua, type = script/lua }
]
