# hyprlock 锁屏配置 (Tokyo Night 配色, 参考 i3/script/lock.sh 风格)
# 来源: dotfiles/hypr/hyprlock.conf

general {
    hide_cursor = true
    grace = 0
    no_fade_in = false
}

background {
    monitor =
    path = /home/xuqinqin/develop/dotfiles/i3/wallpaper/nature-landscape-sea-waves-night-nightscape-2153145-wallhere.com.jpg
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.9
    brightness = 0.8
    vibrancy = 0.2
}

input-field {
    monitor =
    size = 260, 50
    position = 0, -20
    halign = center
    valign = center
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    rounding = 12
    outer_color = rgba(7aa2f7ff)
    inner_color = rgba(1a1b26ff)
    font_color = rgba(c0caf5ff)
    placeholder_text = <span foreground="#565f89">输入密码…</span>
    fail_text = <i>$ATTEMPTS</i> 次尝试失败
    fail_color = rgba(ebcb8bff)
    check_color = rgba(7dcfffff)
    capslock_color = rgba(ebcb8bff)
    fade_on_empty = true
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(c0caf5ff)
    font_size = 96
    font_family = JetBrainsMono Nerd Font
    position = 0, 180
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%Y-%m-%d  %A"
    color = rgba(7aa2f7ff)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 110
    halign = center
    valign = center
}
