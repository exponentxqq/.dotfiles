# fuzzel 启动器配置 (Tokyo Night, 替代 dmenu/albert)
# 来源: dotfiles/hypr/fuzzel/fuzzel.ini

[main]
font=JetBrainsMono Nerd Font:size=13
terminal=kitty
width=42
lines=10
horizontal-pad=18
vertical-pad=14
inner-pad=10
layer=overlay
prompt="  "

[colors]
background=1a1b26f2
text=c0caf5ff
prompt=7dcfffff
placeholder=565f89ff
input=c0caf5ff
match=7aa2f7ff
selection=283457ff
selection-text=c0caf5ff
selection-match=7aa2f7ff
border=7aa2f7ff

[border]
width=2
radius=10

[dmenu]
exit-immediately-if-empty=yes
