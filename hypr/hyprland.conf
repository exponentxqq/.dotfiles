# Hyprland 配置
# 目标机器: MacBook Pro 2016 15" (MacBookPro14,2) - Intel HD530 + AMD Polaris
# 来源: dotfiles/hypr/hyprland.conf (软链至 ~/.config/hypr)
# 键位习惯参考仓库中 i3/config: $mod=Super(cmd⌘), vim 风格 hjkl, gaps 7/3

#####################
###  显示器 (2x)  ###
#####################
# Retina 2880x1800 缩放 2x; 如外接显示器在此追加:
#   monitor = DP-1, preferred, auto, 1
monitor = eDP-1, 2880x1800@60, 0x0, 1.5

#############################
###  环境变量 (输入法等)  ###
#############################
env = GTK_IM_MODULE,fcitx
env = QT_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx
env = SDL_IM_MODULE,fcitx
# 2x 缩放下光标大小
env = XCURSOR_SIZE,48
# Electron 应用优先走 Wayland
env = ELECTRON_OZONE_PLATFORM_HINT,auto

#####################
###   自启动      ###
#####################
exec-once = waybar
exec-once = mako
exec-once = hyprpaper
exec-once = hypridle
exec-once = fcitx5 -d --replace
exec-once = systemctl --user start hyprpolkitagent.service
# Touch Bar: T1 机型 (05ac:8600/1281), 固件缺失时无法驱动; 见 install.sh 说明
# 剪贴板历史 (cliphist)
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

#####################
###   外观        ###
#####################
general {
    gaps_in = 7
    gaps_out = 3
    border_size = 2
    col.active_border = rgba(7aa2f7ff) rgba(bb9af7ff) 45deg
    col.inactive_border = rgba(3b4261aa)
    layout = dwindle
    resize_on_border = true
    allow_tearing = false
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.97

    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
        ignore_opacity = true
    }

    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(00000066)
    }
}

animations {
    enabled = true
    bezier = easeOut, 0.16, 1, 0.3, 1
    animation = windows, 1, 5, easeOut
    animation = windowsOut, 1, 5, default, popin 80%
    animation = fade, 1, 5, default
    animation = workspaces, 1, 4, easeOut, slide
    animation = layers, 1, 3, default
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    disable_hyprland_logo = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    focus_on_activate = true
}

#####################
###   输入        ###
#####################
input {
    # Mac 键盘 (hid_apple): cmd⌘ -> Super, option⌥ -> Alt
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        clickfinger_behavior = true
        disable_while_typing = true
    }
}

# 触摸板手势 (0.51+ 新语法, 顶层 gesture 指令)
gesture = 3, horizontal, workspace

# grim 截图免密码提示
permission = /usr/(bin|local/bin)/grim, screencopy, allow

#####################
###   快捷键      ###
#####################
$mod = SUPER

# --- 启动器 / 终端 ---
bind = $mod, RETURN, exec, kitty
bind = $mod, D, exec, fuzzel
# 下拉终端 (对应 i3 的 tdrop)
bind = $mod, grave, exec, ~/.config/hypr/script/dropterm.sh
# 重启状态栏 (对应 i3 的 $mod+b)
bind = $mod, B, exec, ~/.config/hypr/script/restart-waybar.sh

# --- 常用应用 (对齐 i3: $mod+z/x/c/v; 未安装的应用按键无反应) ---
bind = $mod, Z, exec, jetbrains-toolbox
bind = $mod, X, exec, google-chrome-stable
bind = $mod, C, exec, slack
bind = $mod, V, exec, feishu

# --- 窗口 ---
bind = $mod, Q, killactive
bind = $mod, F, fullscreen, 0
bind = $mod SHIFT, F, fullscreen, 1
bind = $mod SHIFT, SPACE, togglefloating   # i3: floating toggle
bind = $mod, E, layoutmsg, togglesplit     # i3: toggle split
bind = $mod, W, togglegroup                # ≈ i3: tabbed (分组)
bind = $mod SHIFT, P, pseudo,              # Hyprland 特有 (i3 无对应)
# 说明: i3 的 $mod+s (stacking) / $mod+space (focus mode_toggle) / $mod+a (focus parent)
#       在 Hyprland 无等价功能, 未绑定

# --- 焦点移动 (vim 风格) ---
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

# --- 移动窗口 ---
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, L, movewindow, r
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

# --- 工作区 1-10 ---
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10
# 鼠标滚动切工作区
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1
# 特殊工作区 (下拉终端)
bind = $mod SHIFT, grave, movetoworkspace, special:dropterm

# --- 会话 ---
bind = $mod SHIFT, C, exec, hyprctl reload
bind = $mod SHIFT, E, exec, hyprctl dispatch exit
bind = $mod CTRL, L, exec, pidof hyprlock || hyprlock

# --- 音量备用键 (对齐 i3: $mod+Shift+= / - / . ; Touch Bar 黑屏时的主力音量键) ---
bind = $mod SHIFT, equal, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = $mod, minus, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = $mod, period, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle

# --- 音量 (Mac 键盘 F10-F12; 语法: bindel = MODS, key, ... MODS 为空也必须保留逗号) ---
bindel = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +10%
bindel = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -10%
bindl = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bindl = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle

# --- 亮度 ---
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# --- 截图 (替代 flameshot) ---
bind = $mod SHIFT, S, exec, ~/.config/hypr/script/screenshot.sh region
bind = $mod SHIFT, A, exec, ~/.config/hypr/script/screenshot.sh full

# --- 剪贴板历史 (i3 无对应; Super+C 已对齐 i3 留给 slack) ---
bind = $mod SHIFT, V, exec, ~/.config/hypr/script/clipboard.sh

#####################
###   子模式      ###
#####################
# i3 风格 window_split 模式: $mod+p 进入; j=水平分割, l=垂直分割
bind = $mod, P, submap, window_split
submap = window_split
bind = , j, layoutmsg, preselect r
bind = , l, layoutmsg, preselect d
bind = , RETURN, submap, reset
bind = , Escape, submap, reset
bind = $mod, P, submap, reset
submap = reset

# i3 风格 resize 模式: $mod+r 进入 (j/k/l/分号/方向键, 同 i3)
bind = $mod, R, submap, resize
submap = resize
bind = , j, resizeactive, -40 0
bind = , k, resizeactive, 0 40
bind = , l, resizeactive, 0 -40
bind = , semicolon, resizeactive, 40 0
bind = , left, resizeactive, -40 0
bind = , down, resizeactive, 0 40
bind = , up, resizeactive, 0 -40
bind = , right, resizeactive, 40 0
bind = , RETURN, submap, reset
bind = , Escape, submap, reset
bind = $mod, R, submap, reset
submap = reset

#####################
###   窗口规则     ###
#####################
# 0.53+ 语法: match: 前缀匹配 + 布尔效果需 "on"
windowrule = match:class ^(copyq)$, float on
windowrule = match:class ^(pavucontrol)$, float on
windowrule = match:class ^(nm-connection-editor)$, float on

# 下拉终端: 浮动 + 顶部 60% + 归入特殊工作区
windowrule = match:class ^(dropterm)$, float on, size 100% 60%, move 0 0, workspace special:dropterm silent
