# hypridle 空闲管理 (替代 i3 的 xss-lock, 同为 MacBook 省电考虑)
# 来源: dotfiles/hypr/hypridle.conf

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# 5 分钟无操作锁屏
listener {
    timeout = 300
    on-timeout = pidof hyprlock || hyprlock
}

# 6 分钟关闭屏幕
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 30 分钟自动挂起 —— 已禁用（2026-10-04 排查结论）
# 本机 amdgpu (Baffin) 所有睡眠恢复路径均失败:
#   S3 resume / S4 (platform & shutdown) 快照恢复 / s2idle -> 全部死机 (amdgpu_device_ip_resume -22)
# 内屏由 dGPU 直连无法禁用 amdgpu, 在 amdgpu 修复前不要启用任何 sleep/hibernate
# listener {
#     timeout = 1800
#     on-timeout = systemctl suspend
# }
