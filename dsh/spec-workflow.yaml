# spec 四段共用阶段级模型路由（文件名沿用 spec-workflow，历史锚定）
#   规划键 lineA/lineB/panel/design → spec-plan 消费
#   apply、engine、parallelism → spec-apply 消费；verify → spec-done 复用（归档前验证与收尾复验）
#   vision 为能力键（读图覆盖），spec-plan（规划线读图）与 spec-apply 共用；四段共用本文件与白名单
# 分档策略（角色化描述：换模型只改下方键值，不改本注释）：
#   高（规划/设计）= 质量锚点：错误会级联且无法自动发现，不降档；
#     规划三线走套餐最新旗舰，设计线走其异家等价；四条规划键均配异家兜底
#   中（执行）= 套餐主力：调用量最大的环节，套餐内成本最优；
#     有「设计契约 + 验证句 + 主会话核对 + 用户审核」四道兜底，路由失败/限流按三档回退
#   低（验证）= 套餐内最低成本通道：机械跑命令 + 汇证据
#   视觉 = 套餐内最低成本读图通道；落到纯文本路由需读图时改走 vision
#   进一步多用套餐的开关：把 lineB 主路由也换成套餐通道（异构第二线，代价是 B 线质量下降）
models:
  # 高：规划三线走套餐最新旗舰（质量锚点；原生支持读图，无需改道 vision）；设计线走其异家等价
  lineA:
    provider: zcode-plan
    model: glm-5.4
    fallback: { provider: deepseek-official, model: deepseek-flash } # 异家兜底
  lineB:
    provider: zcode-plan
    model: glm-5.4
    fallback: { provider: deepseek-official, model: deepseek-flash }
  panel:
    provider: zcode-plan
    model: glm-5.4
    fallback: { provider: deepseek-official, model: deepseek-flash }
  design:
    provider: deepseek-official
    model: deepseek-flash
    fallback: { provider: zcode-plan, model: glm-5.4 }
  apply:
    provider: opencode-go
    model: deepseek-v4.1-flash
    # fallback: { provider: opencode-go, model: deepseek-v4.1-flash }
    fallback: { provider: zcode-plan, model: glm-5.3-flash }
  verify:
    provider: zcode-plan
    model: glm-5.3-flash
    fallback: { provider: opencode-go, model: deepseek-v4.1-flash }
  # 视觉：套餐内最低成本的读图通道（纯文本路由需读图时改走此键）
  vision: { provider: zcode-plan, model: glm-5.3-flash }

# 执行引擎偏好（可被 --engine 覆盖）：subagent | team
engine: subagent

# 同组并行上限
parallelism: 8
