# spec 四段共用阶段级模型路由（文件名沿用 spec-workflow，历史锚定）
#   规划键 lineA/lineB/panel/design → spec-plan 消费
#   apply、engine、parallelism → spec-apply 消费；verify → spec-done 复用（归档前验证与收尾复验）
#   vision 为能力键（读图覆盖），spec-plan（规划线读图）与 spec-apply 共用；四段共用本文件与白名单
models:
  # 规划阶段：glm-5.3（图片输入能力 = 无，纯文本）；需读图时改用下面的 vision
  lineA: { provider: zai-coding-cn, model: glm-5.3 }
  lineB: { provider: zai-coding-cn, model: glm-5.3 }
  panel: { provider: zai-coding-cn, model: glm-5.3 }
  # 设计线阶段路由：阶段 1.7 代码设计子代理（恒派 fresh；与规划三线同级强模型）
  design: { provider: zai-coding-cn, model: glm-5.3 }
  # 执行阶段（含归档前验证）：deepseek-v4.1-flash 主用，deepseek-flash 备用；两者都支持图片输入
  apply:
    provider: opencode-go
    model: deepseek-v4.1-flash
    fallback: { provider: deepseek-official, model: deepseek-flash }
  verify:
    provider: opencode-go
    model: deepseek-v4.1-flash
    fallback: { provider: deepseek-official, model: deepseek-flash }
  # 读图覆盖：glm-5.3-flash（支持 text+image）——规划线/复算线要看截图、设计稿时改用它
  vision: { provider: zai-coding-cn, model: glm-5.3-flash }

# 执行引擎偏好（可被 --engine 覆盖）：subagent | team
engine: subagent

# 同组并行上限
parallelism: 8
