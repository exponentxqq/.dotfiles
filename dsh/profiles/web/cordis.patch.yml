# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: dark
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: zcode-plan
    model: glm-5.3
# 模型提供商；key 由 compose env_file 从宿主 ~/.secrets 注入容器（优先于 credentials.yaml，
# zcode-plan 例外：凭证由插件全生命周期自管，apiKeyEnv 仅兜底）
- id: llm-deepseek
  name: "@deepseek-ai/dsh-llm-deepseek-api-key"
  config:
    # deepseek-official 路由；与内置默认一致，显式声明以自文档
    apiKeyEnv: DEEPSEEK_API_KEY
    # subagent 路由不携带 effort，取 provider 默认（不配置时内置默认 high）→ 规划/设计锚点统一 max
    reasoningEffort: max
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      zai:
        apiKeyEnv: ZAI_API_KEY
        reasoning: max
      opencode-go:
        apiKeyEnv: OPENCODE_GO_API_KEY
        reasoning: max
        # 目录收窄：models 整体替换内置 28 模型目录（未设字段从同 id 已安装模型取默认），
        # 仅保留 deepseek 系列与 Kimi K3
        models:
          - id: deepseek-v4-pro
          - id: deepseek-v4.1-flash
          - id: kimi-k3
      zai-coding-cn:
        apiKeyEnv: ZAI_CODING_CN_API_KEY
        reasoning: max
      zcode-plan:
        displayName: GLM Coding Plan (ZCode PAT)
        apiKeyEnv: ZCODE_PLAN_PAT
        api: openai-completions
        baseURL: https://open.bigmodel.cn/api/coding/paas/v4
        reasoning: max
        retryPolicy:
          mode: normal
          retryableCodes:
            - EMPTY_RESPONSE
            - RATE_LIMIT
            - SERVER
            - TIMEOUT
            - TRANSPORT
            - INVALID_CREDENTIAL
        models:
          - id: glm-5.3
            name: GLM-5.3
            contextWindow: 1000000
            maxTokens: 131072
            input:
              - text
            reasoningEfforts:
              off: null
              low: low
              medium: high
              high: high
              max: max
            compat:
              thinkingFormat: zai
              supportsReasoningEffort: true
              supportsStore: false
              supportsDeveloperRole: false
              supportsStrictMode: true
              maxTokensField: max_tokens
          - id: glm-5.3-flash
            name: GLM-5.3 Flash
            contextWindow: 1000000
            maxTokens: 131072
            input:
              - text
              - image
            reasoningEfforts:
              off: null
              low: low
              medium: high
              high: high
              max: max
            compat:
              thinkingFormat: zai
              supportsReasoningEffort: true
              supportsStore: false
              supportsDeveloperRole: false
              supportsStrictMode: true
              maxTokensField: max_tokens
# 历史备注：曾试装 dsh-zcode-persona 插件，其 settings 装配路径在 dsh 0.2.1 失效，
# 后手工配置 zai-coding-zcode provider（API Key + 仿客户端指纹头直连）；
# 2026-11-04 已被 zcode-plan 插件（PAT 签名通道，折扣刻度）取代并移除。
# 启用 skill 工具链，扫描 skctl 聚合层（容器内挂载 ~/.agents/skills，见 docker compose SKCTL_STORE_PATH）
- id: skill-filesystem
  name: "@deepseek-ai/dsh-skill-filesystem"
  disabled: false
  config:
    includeDefaultRoots: false
    customSkillDirs:
      - /home/docker/.agents/skills
- id: tool-skill
  name: "@deepseek-ai/dsh-tool-skill"
  disabled: false
# dbx MCP 已从「用户级」迁到 opc 的**项目级**配置：company/opc/.dsh/mcp/dbx.yaml
# 由 dsh-plugin-project-mcp 扫描并按工作区隔离——只有 opc 工作区的会话看得到 mcp__dbx__*，
# 服务器命令/参数与原配置一致。如确需全局 dbx（所有工作区可见），恢复下面注释的 insert 即可。
# 注意勿与项目级同名配置并存：profile 行先占住 serverName，项目侧那台会被记 error 跳过。
# - insert:
#     - id: mcp-dbx
#       name: "@deepseek-ai/dsh-mcp-client"
#       config:
#         serverName: dbx
#         transport: stdio
#         command: npx
#         args: [ "-y", "@dbx-app/mcp-server" ]
#         env:
#           DBX_WEB_URL: http://dbx:4224
# 接入 codebase-memory MCP：代码知识图谱检索（agent 指令要求优先使用；二进制由宿主机 npm 全局包目录挂载提供，见 compose tools.yml）
- insert:
    - id: mcp-codebase-memory
      name: "@deepseek-ai/dsh-mcp-client"
      config:
        serverName: codebase-memory
        transport: stdio
        command: codebase-memory-mcp
        args: []
# chrome-devtools MCP：全局共享挂载（多会话同时可用）
# dsh-mcp-client 在 profile 级为宿主作用域单实例——所有会话同时看到 mcp__chrome-shared__*，
# 并发请求经同一 MCP 进程多路复用（--pageIdRouting 默认开、按 pageId 路由，官方即为并发
# agent 会话设计）；直连 entrypoint.d/70-shared-chromium.sh 常驻的 9222 共享浏览器。
# 进程恒 =1、随 dsh 主进程生灭：无每会话 spawn、无泄漏（对比 project-mcp 的按工作区隔离
# 仍是每会话实例）。启动命令与官方包装器 dsh-experimental-browser-use-chrome-devtools-mcp
# 完全一致（node + --no-usage-statistics + --browser-url）。
# 注意：多会话共用一个浏览器，操作同一标签页会互相干扰——不同会话请用不同标签页。
# 依赖：chrome-devtools-mcp 由本 profile package.json 直接 pin（1.12.0），与包装器无关。
- insert:
    - id: mcp-chrome-shared
      name: "@deepseek-ai/dsh-mcp-client"
      config:
        serverName: chrome-shared
        transport: stdio
        command: node
        args:
          - /home/docker/.dsh/profiles/web/node_modules/chrome-devtools-mcp/build/src/bin/chrome-devtools-mcp.js
          - --no-usage-statistics
          - --browser-url
          - http://127.0.0.1:9222
# browser-use 互斥挂载（exclusive：同一时刻仅一个会话可用、其余会话工具自动掩码，且占用
# 不随归档释放、dsh 无「关闭会话」操作可解）已由上面的全局共享挂载取代，停用保结构。
# 回退：删掉两条 disabled: true 即恢复互斥单会话模式（与 chrome-shared 不同名，可并存不冲突）。
- insert:
    - id: browser-use
      name: "@deepseek-ai/dsh-browser-use"
      disabled: true
    - id: browser-use-devtools
      name: "@deepseek-ai/dsh-experimental-browser-use-chrome-devtools-mcp"
      disabled: true
      config:
        mode: attach
        endpoint: http://127.0.0.1:9222
- id: dsh-better-input
  name: dsh-better-input
  config:
    language: zh-CN
    maxRecordingSeconds: 120
    polishingEnabled: true
    polishProvider: deepseek-official
    polishModel: deepseek-flash
    polishReasoningEffort: ""
    polishPrompt: ""
    optimizeEnabled: true
    optimizeProvider: deepseek-official
    optimizeModel: deepseek-flash
    optimizeReasoningEffort: ""
    optimizePrompt: ""
    contextTurns: 3
    ocrProvider: zai
    ocrModel: glm-5.3-flash
# figma MCP 已从「用户级」迁到 opc 的**项目级**配置：company/opc/.dsh/mcp/figma.yaml
# 由 dsh-plugin-web-ux 扫描并按工作区隔离——只有 opc 工作区的会话看得到 mcp__figma__*，
# 服务器命令/参数与原配置一致，仅 --image-dir 收窄到 opc 项目根。
# 如确需全局 figma（所有工作区可见），把这段 insert 恢复即可（勿与项目级同名配置并存：
# 同名先到先得，后来者会被记 error 跳过）。
# 多根工作区（本地 fork：dsh-plugins 仓库 plugins/dsh-plugin-multi-root-workspace，见 ~/develop/person/dsh-plugins）
# 附加根与主根同权、仍走内核级方言，不降级 danger-full-access。
# seedRoots/seedPrimaryRoots：首次使用某个主根时播种下列根；台账在
# $DSH_HOME/storages/multi_root_workspace.seeded.json，删除已播种的根是永久的，
# 想重新播种就删台账条目（见插件 docs/reference/additional-root-seeding.md）。
# commonRoots：对**所有**主根生效的通用根（配置即授予、不写登记表、无台账、
# 目录出现即生效），用于几乎每个项目都要写的机器级目录
# （见插件 docs/reference/common-additional-roots.md）。
- id: multi-root-registry
  config:
    leasePath: !!js dshHomePath('storages/multi_root_workspace.lock')
    seedRoots:
      # 仓库根用绝对路径：容器内 ~ 是 /home/docker、宿主是 /home/xuqinqin
      - /home/xuqinqin/develop/docker
      - /home/xuqinqin/develop/dotfiles
      - /home/xuqinqin/develop/apigen
      - /home/xuqinqin/develop/company/skills
    seedPrimaryRoots:
      - /home/xuqinqin/develop/company/opc
    commonRoots:
      # 家目录相对，两个环境各自解析（容器 /home/docker/.cache、宿主 /home/xuqinqin/.cache）。
      # 目的：让 post-commit hook（cbm-hook-pending / cbm-hook.log / codebase-memory-mcp）
      # 在**任何项目**的会话内都可写——不再逐个主根播种。
      - ~/.cache
      - /tmp
# 阶段级模型路由白名单：dsh/spec-workflow.yaml 的 models 路由必须是本列表子集，
# 覆盖 zai / zai-coding-cn / zcode-plan / opencode-go / deepseek-official 常用路由。
# 注：tool-subagent.modelSelectionSettings 已由 agent 预设层（cordis/standard/ptc）
# 自带 true，profile 层再写同 id 只会落到被禁用的宿主行（无效果），故此处不再覆盖。
- id: subagent-model-selection-settings
  config:
    enabled: true
    allowedModels:
      - provider: zai
        model: glm-5.3
      - provider: zai
        model: glm-5.3-flash
      - provider: zai-coding-cn
        model: glm-5.3
      - provider: zai-coding-cn
        model: glm-5.3-flash
      - provider: zcode-plan
        model: glm-5.3
      - provider: zcode-plan
        model: glm-5.3-flash
      - provider: opencode-go
        model: deepseek-v4.1-flash
      - provider: deepseek-official
        model: deepseek-flash
- id: subagent
  name: "@deepseek-ai/dsh-subagent"
  config:
    maxDepth: 2
- id: web-search-deepseek
  name: "@deepseek-ai/dsh-web-search-deepseek"
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    maxUses: 10
- id: web
  name: "@deepseek-ai/dsh-web"
  config:
    searchProvider: deepseek-search-api
    fetchProvider: deepseek-fetch-api

# zcode-plan 插件配置（organization / project 为必填项，从 bigmodel 控制台/用量页 URL 取得）
- id: zcode-plan
  config:
    organization: org-410f85E2098545a6A21392Ad5219f949
    project: proj_edc492aAfee84c85BF582dD57be6108A
- id: dsh-context
  name: dsh-context
  config:
    defaultOverviewRange: 30d
