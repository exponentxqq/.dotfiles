# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: dark
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: zai
    model: glm-5.3
    reasoningEffort: max
# 三个模型提供商；key 由 compose env_file 从宿主 ~/.secrets 注入容器（优先于 credentials.yaml）
- id: llm-deepseek
  name: "@deepseek-ai/dsh-llm-deepseek-api-key"
  config:
    # deepseek-official 路由；与内置默认一致，显式声明以自文档
    apiKeyEnv: DEEPSEEK_API_KEY
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      zai:
        apiKeyEnv: ZAI_API_KEY
        reasoningEffort: max
      opencode-go:
        apiKeyEnv: OPENCODE_GO_API_KEY
        reasoningEffort: max
# 启用 skill 工具链，扫描 skctl 聚合层（容器内挂载 ~/.agents/skills，见 docker compose SKCTL_STORE_PATH）
- id: skill-filesystem
  name: "@deepseek-ai/dsh-skill-filesystem"
  disabled: false
  config:
    includeDefaultRoots: false
    customSkillDirs:
      - /home/docker/.agents/skills
- id: tool-skill
  name: "@deepseek-ai/dsh-tool-skill"
  disabled: false
# 接入 dbx MCP：stdio 启动 @dbx-app/mcp-server（镜像预装），连接 dbx web（同 compose 网络）
- insert:
    - id: mcp-dbx
      name: "@deepseek-ai/dsh-mcp-client"
      config:
        serverName: dbx
        transport: stdio
        command: npx
        args: [ "-y", "@dbx-app/mcp-server" ]
        env:
          DBX_WEB_URL: http://dbx:4224
# 接入 codebase-memory MCP：代码知识图谱检索（agent 指令要求优先使用；二进制由宿主机 npm 全局包目录挂载提供，见 compose tools.yml）
- insert:
    - id: mcp-codebase-memory
      name: "@deepseek-ai/dsh-mcp-client"
      config:
        serverName: codebase-memory
        transport: stdio
        command: codebase-memory-mcp
        args: []
# 启用 browser-use：chrome-devtools-mcp 提供方（实验性，headless 容器模式；chromium 由镜像/apt 提供）
# executablePath 指向 wrapper（~/.dsh/bin/chromium-launch）：注入 --no-sandbox（容器 seccomp 禁 userns）
# 与 --disable-dev-shm-usage（/dev/shm 64M 限制）；compose 若放开 seccomp 可改回 /usr/bin/chromium
- insert:
    - id: browser-use
      name: "@deepseek-ai/dsh-browser-use"
    - id: browser-use-devtools
      name: "@deepseek-ai/dsh-experimental-browser-use-chrome-devtools-mcp"
      config:
        mode: launch
        headless: true
        executablePath: /home/docker/.dsh/bin/chromium-launch
- id: dsh-better-input
  name: dsh-better-input
  config:
    language: zh-CN
    maxRecordingSeconds: 120
    polishingEnabled: true
    polishProvider: deepseek-official
    polishModel: deepseek-flash
    polishReasoningEffort: ""
    polishPrompt: ""
    optimizeEnabled: true
    optimizeProvider: deepseek-official
    optimizeModel: deepseek-flash
    optimizeReasoningEffort: ""
    optimizePrompt: ""
    contextTurns: 3
    ocrProvider: zai
    ocrModel: glm-5.3-flash
# 接入 figma MCP（Framelink figma-developer-mcp）：design-to-code 读设计稿（布局/样式精简元数据 + 图片导出）
# PAT 由图外 compose env_file 从宿主 ~/.secrets 注入容器（FIGMA_API_KEY），此处 !!js 显式传入子进程
# （dsh-mcp-client 会清洗子进程环境中匹配 KEY|TOKEN|SECRET 的变量，必须显式注入）
# --image-dir 是图片下载白名单根（项目无关）；调用工具时用 localPath 落到各项目，如 opc 传 company/opc/.figma-assets
- insert:
    - id: mcp-figma
      name: "@deepseek-ai/dsh-mcp-client"
      config:
        serverName: figma
        transport: stdio
        # 预装于宿主 /data/dsh/figma-mcp（容器 /home/docker/.dsh/figma-mcp）：数据目录持久、非 git 仓
        # 首次安装/升级：docker exec dsh npm install --prefix /home/docker/.dsh/figma-mcp figma-developer-mcp@0.13.2
        command: /home/docker/.dsh/figma-mcp/node_modules/.bin/figma-developer-mcp
        args:
          - "--stdio"
          - "--no-telemetry"
          - "--image-dir"
          - "/home/xuqinqin/develop"
        env:
          FIGMA_API_KEY: !!js process.env.FIGMA_API_KEY

# 多根工作区（本地 fork：dotfiles/dsh/plugins/dsh-plugin-multi-root-workspace）
# 附加根与主根同权、仍走内核级方言，不降级 danger-full-access。
# 首次使用某个主根时播种下列根；台账在 $DSH_HOME/storages/multi_root_workspace.seeded.json，
# 删除已播种的根是永久的，想重新播种就删台账条目（见插件 docs/reference/additional-root-seeding.md）。
- id: multi-root-registry
  config:
    leasePath: !!js dshHomePath('storages/multi_root_workspace.lock')
    seedRoots:
      # 仓库根用绝对路径：容器内 ~ 是 /home/docker、宿主是 /home/xuqinqin
      - /home/xuqinqin/develop/docker
      - /home/xuqinqin/develop/dotfiles
      - /home/xuqinqin/develop/apigen
      - /home/xuqinqin/develop/company/skills
      # 家目录相对，两个环境各自解析（容器 /home/docker/.cache、宿主 /home/xuqinqin/.cache）
      # 目的：让 post-commit hook（cbm-hook-pending / cbm-hook.log / codebase-memory-mcp）在会话内可写
      - ~/.cache
    seedPrimaryRoots:
      - /home/xuqinqin/develop/company/opc
