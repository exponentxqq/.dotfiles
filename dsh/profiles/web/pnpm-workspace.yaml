packages:
  - .
autoInstallPeers: false

nodeLinker: hoisted
patchedDependencies:
  dsh-pocket@2.10.6: patches/dsh-pocket@2.10.6.patch

# pnpm ≥10 默认不执行依赖的构建脚本。本仓插件自 v1.1.1 起产物 lib/ 随 tag 提交、包内
# 没有 `prepare`，git 来源安装不触发构建授权（pnpm 10 与 ≥11 行为一致），因此这里只剩
# 注册表依赖 `koffi`（multi-root 的原生依赖，install 脚本做本地预编译）——按包名匹配，
# 不随 tag 变化，表态一次即永久有效。
# `canvas`（传递依赖）的构建脚本保持忽略：不本地编译也能用。
onlyBuiltDependencies:
  - koffi
