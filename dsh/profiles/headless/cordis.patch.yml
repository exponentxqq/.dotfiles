# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
# 启用 skill 工具链，扫描 skctl 聚合层（容器内挂载 ~/.agents/skills，见 docker compose SKCTL_STORE_PATH）
- id: skill-filesystem
  name: "@deepseek-ai/dsh-skill-filesystem"
  disabled: false
  config:
    includeDefaultRoots: false
    customSkillDirs:
      - /home/docker/.agents/skills
- id: tool-skill
  name: "@deepseek-ai/dsh-tool-skill"
  disabled: false
# 接入 dbx MCP：stdio 启动 @dbx-app/mcp-server（镜像预装），连接 dbx web（同 compose 网络）
- insert:
    - id: mcp-dbx
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: dbx
        transport: stdio
        command: npx
        args: ['-y', '@dbx-app/mcp-server']
        env:
          DBX_WEB_URL: http://dbx:4224
# 三个模型提供商；key 由 compose env_file 从宿主 ~/.secrets 注入容器（优先于 credentials.yaml）
- id: llm-deepseek
  name: "@deepseek-ai/dsh-llm-deepseek-api-key"
  config:
    # deepseek-official 路由；与内置默认一致，显式声明以自文档
    apiKeyEnv: DEEPSEEK_API_KEY
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      zai:
        apiKeyEnv: ZAI_API_KEY
      opencode-go:
        apiKeyEnv: OPENCODE_GO_API_KEY
# 接入 codebase-memory MCP：代码知识图谱检索（agent 指令要求优先使用；二进制由宿主机 npm 全局包目录挂载提供，见 compose tools.yml）
- insert:
    - id: mcp-codebase-memory
      name: "@deepseek-ai/dsh-mcp-client"
      config:
        serverName: codebase-memory
        transport: stdio
        command: codebase-memory-mcp
        args: []
