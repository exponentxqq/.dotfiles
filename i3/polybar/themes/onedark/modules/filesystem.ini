[module/filesystem]
type = internal/fs
interval = 30

mount-0 = /
mount-1 = /home

format-mounted = <label-mounted>
format-mounted-prefix = %{T10}%{T-}
format-mounted-prefix-background = ${colors.blue}
format-mounted-prefix-foreground = ${colors.bg}
format-mounted-prefix-padding = 1

label-mounted = %{T1}%mountpoint% %percentage_used%%%{T-}
label-mounted-background = ${colors.blue-alt}
label-mounted-foreground = ${colors.blue}
label-mounted-padding = 1

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.red}
