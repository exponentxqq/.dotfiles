[module/weather]
type = custom/ipc
initial = 1

hook-0 = $HOME/.config/polybar/scripts/weather/hook.sh 0 &
hook-1 = $HOME/.config/polybar/scripts/weather/hook.sh 1 &

format-prefix = %{T10}%{T-}
format-prefix-background = ${colors.green}
format-prefix-foreground = ${colors.bg}
format-prefix-padding = 1
label-background = ${colors.green-alt}
label-foreground = ${colors.green}
label-padding = 1
